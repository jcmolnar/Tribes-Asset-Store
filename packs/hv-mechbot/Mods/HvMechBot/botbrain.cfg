# HvMechBot: built-in bots OFF under this mod.
#
# The game reads the first botbrain.cfg it finds in a loaded mod folder INSTEAD of
# config\botbrain.cfg. This one has no "bot" lines, so the roster is empty and the built-in
# bots stay off while this mod is loaded, whatever the host's own bot setting is. Other mods
# are not affected.
#
# Why: this mod brings its own bots (Spoonbot; roster in HvMechBot.cs / hvMechLite.cs), and the
# stock roster equips disclauncher / Chaingun / PlasmaGun / GrenadeLauncher and the mfemale
# armour, none of which exist in this mod (its weapons are PPC, MedLas, Ultra5 ... and its
# armours are the mechs).
#
# To try the built-in bots anyway, add lines in the stock format:
#   bot  <team> <armor> <voice> <name>
#   gear <armor> <itemData> <count>
#   weap <armor> <maxDist> <itemData>
# Not tested with this mod.
