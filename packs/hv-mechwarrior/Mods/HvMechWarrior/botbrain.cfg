# hvMechWarrior: built-in bots OFF under this mod.
#
# The game reads the first botbrain.cfg it finds in a loaded mod folder INSTEAD of
# config\botbrain.cfg. This one has no "bot" lines, so the roster is empty and the bots stay off
# while this mod is loaded, whatever the host's own bot setting is. Other mods are not affected.
#
# Why: the stock roster equips disclauncher / Chaingun / PlasmaGun / GrenadeLauncher and uses the
# mfemale armour. hvMechWarrior has none of those (its weapons are PPC, MedLas, Ultra5 ... and its
# armours are the mechs), so every gear line would fail and the bots would fight bare-handed.
#
# To try bots anyway, add lines in the stock format:
#   bot  <team> <armor> <voice> <name>        e.g.  bot 0 parmor male1 Kerensky
#   gear <armor> <itemData> <count>           e.g.  gear parmor PPC 1
#   weap <armor> <maxDist> <itemData>         e.g.  weap parmor 300 PPC
# Not tested with this mod.
