# BotBrain roster + gear + weapons for the Star Wars TC. Same format as config\botbrain.cfg
# (see its header); this file REPLACES it whenever the StarWars mod is active, because the
# TC has none of the stock weapons the config\ file hands out (DiscLauncher, Chaingun,
# PlasmaGun, GrenadeLauncher) -- every one of those lines failed with "incorrect item type"
# and the bots fought bare-handed.
#   bot  <team> <armor> <voice> <name>
#   gear <armor|role> <itemDat> <count>   (first line per armor is mounted)
#   weap <armor|role> <maxDist> <itemDat> (ordered near->far)
# Team 0 = Rebel Alliance, team 1 = Imperial Forces (mission team order).

bot 0 marmor male1 BB_Wedge
bot 0 marmor male2 BB_Biggs
bot 0 larmor male3 BB_Dak
bot 0 mfemale fem1 BB_Toryn
bot 0 marmor male4 BB_Hobbie
bot 0 larmor fem2 BB_Zev
bot 1 marmor male5 BB_Veers
bot 1 marmor male1 BB_Piett
bot 1 larmor male2 BB_Ozzel
bot 1 mfemale fem3 BB_Needa
bot 1 marmor male3 BB_Motti
bot 1 larmor fem4 BB_Jerjerrod

# A map with no inventory station is a fixed-loadout map: everyone spawns light.
fixedarmor larmor

# Loadouts follow the TC's own bot config (config\spoonbot_starwars.cs): a lightsaber for
# close work and a blaster for range. All blasters draw BlasterAmmo ($WeaponAmmo, item.cs).
gear marmor GSaber 1
gear marmor HBlaster 1
gear marmor BlasterAmmo 150
gear marmor energypack 1
gear marmor repairkit 1
gear mfemale MSaber 1
gear mfemale NBlaster 1
gear mfemale BlasterAmmo 150
gear mfemale energypack 1
gear mfemale repairkit 1
gear larmor GSaber 1
gear larmor HBlaster 1
gear larmor BlasterAmmo 100
gear larmor energypack 1
gear larmor repairkit 1

weap marmor 12 GSaber
weap marmor 140 HBlaster
weap mfemale 12 MSaber
weap mfemale 140 NBlaster
weap larmor 12 GSaber
weap larmor 140 HBlaster

# Role-scoped: the marksman carries Boba's rifle, home defence the trooper blaster.
gear sniper BBlaster 1
gear sniper BlasterAmmo 100
gear sniper energypack 1
gear sniper repairkit 1
weap sniper 300 BBlaster
gear guard RSaber 1
gear guard TBlaster 1
gear guard BlasterAmmo 150
gear guard energypack 1
gear guard repairkit 1
weap guard 12 RSaber
weap guard 140 TBlaster

skill capper 100
skill chase 92
skill switch 90
skill lo 82
skill sniper 78
skill mid 70
skill guard 55

comp ctf capper 2
comp ctf guard 1
comp ctf chase 1
comp ctf lo 1
comp ctf sniper 1
comp ctf mid 99
comp cnh switch 3
comp cnh mid 99
comp dm mid 99
